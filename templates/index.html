<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Caption Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-lg w-full text-center">
        <h2 class="text-2xl font-bold mb-4">Image #{{ image_index + 1 }}</h2>
        <img src="{{ image_url }}" alt="Image" class="w-full rounded-lg shadow-md">
        <form action="/" method="post" class="mt-4">
            <input type="hidden" name="image_index" value="{{ image_index }}">
            <p class="text-gray-700 font-semibold mb-2">Describe the image in English:</p>
            <textarea name="expression" rows="4" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Type your description here..." required></textarea>
            <button type="submit" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-600 transition">Submit</button>
        </form>
    </div>
</body>
</html>
