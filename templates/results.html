<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-lg w-full text-center">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Teacher's Feedback</h2>
        <p class="text-gray-700"><strong>Generated Caption:</strong> {{ caption }}</p>
        <p class="text-gray-700"><strong>Your Expression:</strong> {{ user_expression }}</p>
        <p class="mt-4 text-lg font-semibold text-blue-600">{{ teacher_feedback }}</p>

        {% if next_index < total_images %}
            <a href="/?image_index={{ next_index }}" class="mt-4 inline-block bg-green-500 text-white px-4 py-2 rounded-lg shadow hover:bg-green-600 transition">
                Next Image →
            </a>
        {% else %}
            <p class="text-gray-600 mt-4">All images completed. Thank you!</p>
        {% endif %}
    </div>
</body>
</html>
